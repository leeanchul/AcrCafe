<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>/gallery/upload_form.html</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>

</head>
<body>
<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
    </ol>
  </nav>
  <h1>이미지 업로드 폼</h1>
  <form th:action="@{/gallery/upload}" method="post" enctype="multipart/form-data">
    <div>
      <label class="form-label" for="caption">설명</label>
      <input class="form-control" type="text" name="caption" id="caption"/>
    </div>
    <div>
      <label class="form-label" for="image">이미지</label>
      <input class="form-control" type="file" name="image" id="image" accept="image/*"/>
    </div>
    <button class="btn btn-outline-dark" type="submit">업로드</button>
  </form>
</div>
</body>
</html>
