<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>사진+글 통합 TEST</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
<a th:href="@{/}">홈</a>
<h1>사진 + 글 테스트중입니다.</h1>

<a th:href="@{/test/insertform}">글 쓰기</a>
<table>
  <thead>
  <tr>
    <th>글 번호</th>
    <th>작성자</th>
    <th>제목</th>
    <th>작성일</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="tmp:${list}">
    <td th:text="${tmp.num}"></td>
    <td th:text="${tmp.writer}"></td>
    <td><a th:href="@{/test/detail(num=${tmp.num})}" th:text="${tmp.title}"></a></td>
    <td th:text="${tmp.regdate}"></td>
  </tr>
  </tbody>
</table>
<nav>
  <ul class="pagination" th:if="${totalPageCount ne 0}">
    <li th:if="${startPageNum != 1}" class="page-item">
      <a class="page-link" th:href="@{'/test/list?pageNum=' + ${startPageNum - 1} + '&condition=' + ${dto.condition} + '&keyword=' + ${dto.keyword} }">Prev</a>
    </li>
    <li th:each="i : ${#numbers.sequence(startPageNum, endPageNum)}" class="page-item" th:classappend="${i == pageNum} ? 'active'">
      <a class="page-link" th:href="@{'/test/list?pageNum=' + ${i} + '&condition=' + ${dto.condition} + '&keyword=' + ${dto.keyword}}">[[${i}]]</a>
    </li>
    <li th:if="${endPageNum < totalPageCount}" class="page-item">
      <a class="page-link" th:href="@{'/test/list?pageNum=' + ${endPageNum + 1} + '&condition=' + ${dto.condition} + '&keyword=' + ${dto.keyword}}">Next</a>
    </li>
  </ul>
</nav>
<form th:action="@{/test/list}" method="get">
  <label for="condition">검색조건</label>
  <select name="condition" id="condition">
    <option value="title_content" th:selected="${dto.condition eq 'title_content'}">제목 + 내용</option>
    <option value="title" th:selected="${dto.condition eq 'title'}">제목</option>
    <option value="writer" th:selected="${dto.condition eq 'writer'}">작성자</option>
  </select>
  <input type="text" name="keyword" placeholder="검색어..." th:value="${dto.keyword}"/>
  <button class="btn btn-primary btn-sm" type="submit">검색</button>
  <a th:href="@{/test/list}" class="btn btn-success btn-sm">새로고침</a>
</form>

<p th:if="${not #strings.isEmpty(dto.keyword)}">
  <strong th:text="${totalRow}"></strong> 개의 글이 검색 되었습니다
</p>
</div>
</body>
</html>
