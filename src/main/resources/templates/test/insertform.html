<!DOCTYPE html>
<html lang="en">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</head>
<meta charset="UTF-8">
<title>Title</title>
</head>
<body>
<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
    </ol>
  </nav>
  <h1>게시물 업로드</h1>
  <form th:action="@{/test/insert}" method="post" enctype="multipart/form-data">
    <div class="mb-2">
      <label class="form-label" for="title">제목</label>
      <input class="form-control" type="text" name="title" id="title"/>
    </div>
    <div>
      <label for="image">이미지</label>
      <input type="file" name="image" id="image" accept="image/*"/>
    </div>
    <div class="mb-2">
      <label class="form-label" for="content">내용</label>
      <textarea class="form-control" name="content" id="content" rows="10"></textarea>
    </div>

    <button class="btn btn-outline-dark" type="submit">업로드</button>
  </form>
</div>
</body>
</html>
