<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test/detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<style>
  img{
      width: 150px;
      height: 150px;
  }
</style>
</head>
<body>

<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active">Detail</li>
    </ol>
  </nav>

<h1>상세한 정보</h1>

<table class="table table-bordered" >
  <thead>
  <th>제목</th>
  <th>작성자</th>
  <th>내용</th>
  <th>작성일</th>
  <th>사진</th>
  </thead>
  <tbody>
  <tr>
    <td th:text="${dto.title}"></td>
    <td th:text="${dto.writer}"></td>
    <td th:text="${dto.content}"></td>
    <td th:text="${dto.regdate}"></td>

    <td>
      <th:block th:if="${dto.saveFileName == null || dto.saveFileName == 'null'}">
      </th:block>
      <th:block th:if="${dto.saveFileName != null && dto.saveFileName != 'null'}">
        <img id="saveFileName" th:src="@{/upload/{name}(name=${dto.saveFileName})}" alt="없음" />
      </th:block>
    </td>

  </tr>
  </tbody>
</table>
</div>
</body>
</html>
