<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test/detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<style>
  img{
      width: 150px;
      height: 150px;
  }
   .comment-box {
       background-color: #f9f9f9;
       border-radius: 8px;
       padding: 15px;
       margin-bottom: 10px;
   }
  .comment-header {
      font-weight: bold;
      color: #007bff;
  }
  .comment-date {
      font-size: 0.875rem;
      color: #6c757d;
  }
  .comment-content {
      margin-top: 10px;
  }
  .comment-form {
      margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
    </ol>
  </nav>

<h1>상세한 정보</h1>
  <div th:if="${userName == dto.writer}">
<a th:href="@{/test/updateform(num=${dto.num})}">수정</a>
  <a th:href="@{/test/delete(num=${dto.num})}">삭제</a>
  </div>
<table class="table table-bordered" >
  <thead>
  <th>제목</th>
  <th>작성자</th>
  <th>내용</th>
  <th>작성일</th>
  <th>사진</th>
  </thead>
  <tbody>
  <tr>
    <td th:text="${dto.title}"></td>
    <td th:text="${dto.writer}"></td>
    <td th:text="${dto.content}"></td>
    <td th:text="${dto.regdate}"></td>

    <td>
      <th:block th:if="${dto.saveFileName == null || dto.saveFileName == 'null'}">
      </th:block>
      <th:block th:if="${dto.saveFileName != null && dto.saveFileName != 'null'}">
        <img id="saveFileName" th:src="@{/upload/{name}(name=${dto.saveFileName})}" alt="없음" />
      </th:block>
    </td>

  </tr>
  </tbody>
</table>
  <!-- 여기서부터 댓글 기능 구현하기 -->
  <!-- 댓글 입력 폼 -->
  <div class="comment-form">
    <form th:action="@{/test/insertComment}" method="post">
      <div class="mb-2">
        <textarea class="form-control" name="content" id="content" placeholder="댓글을 입력하세요"></textarea>
      </div>
      <!-- 숨겨진 필드로 작성자와 ref_group 값 전송 -->
      <input type="hidden" name="ref_group" th:value="${dto.num}" />
      <button type="submit" class="btn btn-primary">댓글달기</button>
    </form>
  </div>

  <!-- 댓글 리스트 -->
  <!-- 댓글 리스트: 네이버 스타일 -->
  <div th:each="tmp:${comment}" class="comment-box">
    <div class="d-flex justify-content-between">
      <span class="comment-header" th:text="${tmp.writer}">작성자</span>
      <span class="comment-date" th:text="${tmp.regdate}">작성일</span>
    </div>
    <div class="d-flex flex-column align-items-center" th:text="${tmp.content}">
      댓글 내용
    </div>
  </div>
</div>
</body>
</html>
