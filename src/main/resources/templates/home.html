<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <style>
      #profileImage{
          width: 50px;
          height: 50px;
          border: 1px solid #cecece;
          border-radius: 50%;
      }

  </style>
</head>
<body>

<div class="container">
  <!-- 로그인 -->
  <div  th:if="${userName != null}">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div>
      <th:block th:if="${dto.profile == null}">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
        </svg>
      </th:block>
      <th:block th:unless="${dto.profile == null}">
        <img id="profileImage" th:src="@{/upload/{name}(name=${dto.profile})}" alt="프로필 이미지" />
      </th:block>
      <a class="nav-link" th:href="@{/user/updateform}"> <p th:text="${userName}"></p></a>
    </div>
    <a class="nav-link" th:href="@{/user/logout}">로그아웃</a>
    </nav>
  </div>
  <!-- 비 로그인 -->
  <div th:unless="${userName != null}">
      <nav class="navbar bg-body-tertiary">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">HOME</a></li>
        </ul>
        <div class="d-flex">
          <a class="nav-link me-2" th:href="@{/user/signupform}">회원가입</a>
          <a class="nav-link me-2" th:href="@{/user/loginform}">로그인</a>
        </div>
      </nav>
  </div>
  <p>홈 페이지 입니다.</p>
  <ul>
    <li><a th:href="@{/play}">놀기</a></li>
    <li><a th:href="@{/notice}">정보</a></li>
    <li><a th:href="@{/security}">비밀</a></li>
    <li><a th:href="@{/test/list}">게시판</a></li>
    <li><a th:href="@{/cafe/list}">한줄일기</a></li>
    <li><a th:href="@{/gallery/list}">갤러리</a></li>
  </ul>
</div>

</body>
</html>
