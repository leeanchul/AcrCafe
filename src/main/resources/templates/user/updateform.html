<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/user/updateform</title>
  <style>
      #profileImage {
          width: 100px;
          height: 100px;
          border: 1px solid #cecece;
          border-radius: 50%;
      }

  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>

</head>

<body>
<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
    </ol>
  </nav>
  <h1><strong th:text="${dto.nickName}"></strong>님정보 수정 </h1>

  <form th:action="@{/user/update}" method="post" enctype="multipart/form-data">
    <div>
      <label class="form-label" for="userName">회원 아이디</label>
      <input class="form-control" th:value="${dto.userName}" type="text" id="userName" disabled>
    </div>
    <div>
      <label class="form-label" for="email">이메일</label>
      <input class="form-control" type="text" id="email" name="email" th:value="${dto.email}"/>
    </div>
    <div>
      <label class="form-label" for="image">이미지</label>
      <input class="form-control" type="file" name="image" id="image" accept="image/*"/>
    </div>
    <div>
      <th:block th:if="${dto.profile == null}">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-person-circle"
             viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
          <path fill-rule="evenodd"
                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
        </svg>
      </th:block>
      <th:block th:unless="${dto.profile == null}">
        <img id="profileImage" th:src="@{/upload/{name}(name=${dto.profile})}" alt="프로필 이미지"/>
      </th:block>
    </div>
    <div>
      <label class="form-label" for="nickName">회원 이름</label>
      <input class="form-control" th:value="${dto.nickName}" type="text" id="nickName" name="nickName">
    </div>
    <div>
      <label class="form-label" for="role">회원 등급</label>
      <input class="form-control" th:value="${dto.role}" type="text" id="role" name="role" disabled>
    </div>

    <button type="submit">수정</button>
  </form>
</div>
</body>
</html>
