<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/user/updateform</title>
  <style>
      #profileImage{
          width: 100px;
          height: 100px;
          border: 1px solid #cecece;
          border-radius: 50%;
      }

  </style>
</head>

<body>
<h1><strong th:text="${dto.nickName}"></strong>님정보 수정 </h1>
<div>
  <form th:action="@{/user/update}" method="post" enctype="multipart/form-data">
    <div>
      <label for="userName">회원 아이디</label>
      <input th:value="${dto.userName}" type="text" id="userName" disabled>
    </div>
<div>
  <label for="email">이메일</label>
  <input type="text" id="email" name="email" th:value="${dto.email}"/>
</div>
    <div>
      <label for="image">이미지</label>
      <input type="file" name="image" id="image" accept="image/*"/>
    </div>
    <div>
      <th:block th:if="${dto.profile == null}">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
        </svg>
      </th:block>
      <th:block th:unless="${dto.profile == null}">
        <img id="profileImage" th:src="@{/upload/{name}(name=${dto.profile})}" alt="프로필 이미지" />
      </th:block>
    </div>
    <div>
      <label for="nickName">회원 이름</label>
      <input th:value="${dto.nickName}" type="text" id="nickName" name="nickName">
    </div>
    <div>
      <label for="role">회원 등급</label>
      <input th:value="${dto.role}" type="text" id="role" name="role" disabled>
    </div>

    <button type="submit">수정 </button>
  </form>
</div>
</body>
</html>
