<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>/user/loginform.html</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
    </ol>
  </nav>
<h3>로그인 폼</h3>
  <div th:if="${ not #strings.isEmpty(param.error)}">
    <p>[[${errMsg}]]</p>
  </div>

  <form th:action="@{/user/login}" method="post">
    <div>
      <label class="form-label" for="userName" >아이디</label>
      <input class="form-control" type="text" name="userName" placeholder="사용자명 입력..."/>
    </div>
      <div>
        <label for="password" class="form-label">비밀번호</label>
      <input class="form-control" type="password" name="password" placeholder="비밀번호 입력..."/>
      </div>
        <button class="btn btn-outline-dark"  type="submit">로그인</button>
  </form>
</div>
</body>
</html>
