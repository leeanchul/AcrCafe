<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/cafe/list</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
<h1>카페~</h1>
<nav>
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
    <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
    <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
    <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
  </ol>
</nav>
<br>
  <a th:href="@{/cafe/addform}">글 올리기</a>

<h3>날짜선택 </h3>
<table class="table table-striped">
  <thead class="table-dark">
  <tr>
    <th>글번호</th>
    <th>작성자</th>
    <th>제목</th>
    <th>내용</th>
    <th>등록일</th>
    <th>수정</th>
    <th>삭제</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="tmp : ${list}">
    <td th:text="${tmp.num}"></td>
    <td th:text="${tmp.writer}"></td>
    <td th:text="${tmp.title}"></td>
    <td><textarea th:text="${tmp.content}" rows="5" cols="50" disabled></textarea></td>
    <td th:text="${tmp.regdate}"></td>
    <div th:if="${userName == tmp.writer}">
    <td><a th:href="@{/cafe/updateform(num=${tmp.num})}">수정</a></td>
    <td><a th:href="@{/cafe/delete(num=${tmp.num})}">삭제</a></td>
    </div>
  </tr>
  </tbody>
</table>
</div>
</body>
</html>
