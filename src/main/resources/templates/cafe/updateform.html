<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/cafe/updateform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
      <li class="breadcrumb-item"><a th:href="@{/test/list}">Cafe</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/gallery/list}">갤러리</a></li>
      <li class="breadcrumb-item active"><a th:href="@{/cafe/list}">한줄일기</a></li>
    </ol>
  </nav>
<h1>글 수정양식</h1>
<form th:action="@{/cafe/update}" method="post" enctype="multipart/form-data">
  <div class="mb-2">
    <label class="form-label" for="num">번호</label>
    <input class="form-control" type="text" id="num" name="num"
           th:value="${dto.num}" readonly/>
  </div>
  <div class="mb-2">
    <label class="form-label" for="title">제목</label>
    <input class="form-control" type="text" id="title" name="title"
           th:value="${dto.title}"/>
  </div>
  <div class="mb-2">
    <label class="form-label" for="content">내용</label>
    <textarea class="form-control" name="content" id="content" rows="10">[[${dto.content}]]</textarea>
  </div>
  <button  class="btn btn-primary" type="submit">수정확인</button>
  <button class="btn btn-warning" type="reset">Reset</button>
</form>
</div>
</body>
</html>
